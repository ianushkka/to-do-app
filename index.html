<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-App</title> 
    <link rel="stylesheet" href="style.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pliant:ital,wght@0,100..900;1,100..900&family=Puritan:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main"> 
        <div class="main-box" id="main-box"> 
            <div class="title-section">
                <div class="heading"><h3>To Do List</h3></div>
                <i class="fa-regular fa-clipboard"></i>
            </div> 

            <div class="input-section">
                <div class="input-wrapper">
                    <input type="text" placeholder="Enter your task" id="user-task"> 
                    <button class="add-btn"type="button" id="add" >Add</button>
                </div>      
            </div>  

            <div class="task-section"></div>

            <div class="stats">
                <div class="total">Tasks : 0 </div> 
                <div class="completed">Completed : 0 </div>
                <div class="remaining">Remaining : 0</div>
            </div>

            
        </div>

    </div>
    
    <script src="app.js"></script>
</body>
</html>
